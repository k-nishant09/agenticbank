# ─────────────────────────────────────────────────────────────────────────────
# config/env.example.yaml — Platform configuration template
#
# Copy to config/env.yaml and fill in your values.
# config/env.yaml is git-ignored and must NEVER be committed.
#
#   cp config/env.example.yaml config/env.yaml
# ─────────────────────────────────────────────────────────────────────────────

wxo:
  # Your watsonx Orchestrate service instance URL.
  # IBM Cloud SaaS:  https://<region>.assistant.watson.cloud.ibm.com/instances/<id>
  # On-prem CPD:     https://<cpd-hostname>/orchestrate
  url: "https://YOUR_ORCHESTRATE_HOST/orchestrate"

  # API key from: WXO_URL/build → user icon → Settings → API details
  api_key: "YOUR_API_KEY"

  # Label for the ADK environment (any string, no spaces)
  env_name: "my-banking-env"

  # Auth type: ibm_iam | mcsp | cpd
  # Leave blank to let the ADK auto-detect from the URL.
  auth_type: ""

  # Set to true for on-prem deployments with self-signed TLS certificates.
  insecure: false

# ── Agent IDs (populated after first deployment) ─────────────────────────────
# Run `orchestrate agents list` after deploying to get these values.
# Used by scripts/test_run.py and scripts/test_all_agents.py.
agents:
  case_supervisor_agent: ""
  customer_360_agent: ""
  kyc_nri_agent: ""
  credit_bureau_agent: ""
  credit_assessment_agent: ""
  document_agent: ""
  compliance_supervisor_agent: ""
  aml_agent: ""
  sanctions_agent: ""
  fema_remittance_agent: ""
  fx_agent: ""
  payment_agent: ""

# ── Test fixtures (used by test_all_agents.py) ────────────────────────────────
test:
  customer_id: "CUST-NRI-88221"
  case_id: "CASE-2026-00441"
  loan_amount_inr: 7500000
  remittance_amount_inr: 2000000
  destination_country: "SGP"
  destination_currency: "SGD"

# ── Langfuse observability (optional — leave blank to disable tracing) ─────────
# Langfuse provides LLM/agent trace observability. For banking deployments,
# ensure PII redaction is enabled and data residency requirements are met
# before connecting to a Langfuse cloud instance.
# Self-hosted Langfuse is recommended for production banking workloads.
#
# Data sent to Langfuse:
#   trace_id, case_id, agent_id, agent_version, prompt_version, tool_name,
#   tool_latency, tokens, cost, error_code, escalation_type
#
# Data NOT sent to Langfuse (redacted before emission):
#   customer PAN, Aadhaar, account numbers, credit score, transaction amounts,
#   beneficiary details, CIBIL report contents
langfuse:
  enabled: false
  host: "https://cloud.langfuse.com"   # or your self-hosted URL
  public_key: ""                        # from Langfuse project settings
  secret_key: ""                        # from Langfuse project settings
  project_name: "axis-banking-agents"
  environment: "development"            # development | staging | production
  redact_pii: true                      # always true for banking

# ── Guardrail settings ────────────────────────────────────────────────────────
guardrails:
  # Circuit breaker: max delegations per agent per case before tripping
  circuit_breaker_limits:
    default: 5
    credit_assessment_agent: 2
    aml_agent: 1
    sanctions_agent: 1
    fema_remittance_agent: 1
    payment_agent: 2

  # Payment high-value threshold (INR) — amounts above this require human approval flag
  payment_high_value_threshold_inr: 5000000

# ── Eval gate settings ────────────────────────────────────────────────────────
evals:
  # Set to true to skip eval gate during deployment (emergency hotfix only)
  skip_gate: false
  # Minimum pass rates — must match slo/agent_slos.yaml
  thresholds:
    credit_assessment_min_pass_rate: 0.95
    compliance_min_pass_rate: 1.00        # zero tolerance for compliance false negatives
    supervisor_routing_min_pass_rate: 0.95
