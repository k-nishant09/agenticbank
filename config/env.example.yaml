# ─────────────────────────────────────────────────────────────────────────────
# config/env.example.yaml — Platform configuration template
#
# Copy to config/env.yaml and fill in your values.
# config/env.yaml is git-ignored and must NEVER be committed.
#
#   cp config/env.example.yaml config/env.yaml
# ─────────────────────────────────────────────────────────────────────────────

wxo:
  # Your watsonx Orchestrate service instance URL.
  # IBM Cloud SaaS:  https://<region>.assistant.watson.cloud.ibm.com/instances/<id>
  # On-prem CPD:     https://<cpd-hostname>/orchestrate
  url: "https://YOUR_ORCHESTRATE_HOST/orchestrate"

  # API key from: WXO_URL/build → user icon → Settings → API details
  api_key: "YOUR_API_KEY"

  # Label for the ADK environment (any string, no spaces)
  env_name: "my-banking-env"

  # Auth type: ibm_iam | mcsp | cpd
  # Leave blank to let the ADK auto-detect from the URL.
  auth_type: ""

  # Set to true for on-prem deployments with self-signed TLS certificates.
  insecure: false

# ── Agent IDs (populated after first deployment) ─────────────────────────────
# Run `orchestrate agents list` after deploying to get these values.
# Used by scripts/test_run.py and scripts/test_all_agents.py.
agents:
  case_supervisor_agent: ""
  customer_360_agent: ""
  kyc_nri_agent: ""
  credit_bureau_agent: ""
  credit_assessment_agent: ""
  document_agent: ""
  compliance_supervisor_agent: ""
  aml_agent: ""
  sanctions_agent: ""
  fema_remittance_agent: ""
  fx_agent: ""
  payment_agent: ""

# ── Test fixtures (used by test_all_agents.py) ────────────────────────────────
test:
